exp_name: pointtransformer_dit_sym_loss
seed: 10
device: auto
data:
  root_dir: data/ShapeNetCore
  augment: false
  val_frac: 0.1
  test_frac: 0.1
  symmetry_precompute_num_points: 4096
model:
  name: pointtransformer_eps
  hidden_dim: 256
  time_dim: 256
  num_heads: 8
  num_layers: 4
loss:
  name: mse
  weighting: snr
  symmetry:
    weight: 0.02
    warmup_steps: 2000
    metric: cd
    axis: 0
train:
  batch_size: 32
  epochs: 1000
  log_every: 50
  num_points: 2048
  num_workers: 8
  out_dir: runs
  save_every: 100
  amp: true
  amp_dtype: fp16
diffusion:
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: linear
  noise_type: gaussian
sampler:
  name: ddpm
  eta: 1.0
  num_samples: 4
  save_dir: samples
  save_format: npy
lr_scheduler:
  name: cosine_warmup
  base_lr: 0.0001
  min_lr: 1.0e-06
  warmup_steps: 500
