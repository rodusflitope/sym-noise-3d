exp_name: pointtransformer_dit_baseline
seed: 10
device: auto
data:
  root_dir: data/ShapeNetCore
  categories:
  - table
  augment: false
  val_frac: 0.1
  test_frac: 0.1
  symmetry_precompute_num_points: 8192
model:
  name: pointtransformer_dit
  hidden_dim: 256
  time_dim: 256
  num_heads: 8
  num_layers: 6
  use_fourier_features: false
  use_symmetric_attention: false
loss:
  name: mse
  weighting: none
train:
  batch_size: 16
  epochs: 2000
  log_every: 50
  num_points: 2048
  num_workers: 8
  out_dir: runs
  save_every: 200
diffusion:
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: linear
  noise_type: gaussian
sampler:
  name: ddpm
  eta: 1.0
  num_samples: 4
  save_dir: samples
  save_format: npy
lr_scheduler:
  name: cosine_warmup
  base_lr: 0.0001
  min_lr: 1.0e-06
  warmup_steps: 500
