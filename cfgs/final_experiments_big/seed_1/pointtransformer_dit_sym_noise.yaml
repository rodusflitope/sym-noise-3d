exp_name: pointtransformer_dit_sym_noise_big_s1
seed: 1
device: auto
data:
  root_dir: data/ShapeNetCore
  categories:
  - table
  augment: false
  val_frac: 0.1
  test_frac: 0.1
  enforce_symmetry: false
  sample_symmetric: true
  symmetry_axis: 0
  symmetry_precompute_num_points: 4096
model:
  name: pointtransformer_dit
  hidden_dim: 256
  time_dim: 256
  num_heads: 8
  num_layers: 6
  use_fourier_features: false
  use_symmetric_attention: false
loss:
  name: mse
  weighting: none
train:
  batch_size: 128
  epochs: 1000
  log_every: 50
  num_points: 2048
  num_workers: 8
  out_dir: runs
  save_every: 100
  amp: true
  amp_dtype: fp16
  weight_decay: 1.0e-06
  val_every: 10
  save_last_every: 25
diffusion:
  T: 1000
  beta_start: 0.0001
  beta_end: 0.02
  schedule: linear
  noise_type: symmetric
  symmetric:
    base_type: gaussian
    mode: reflected
    axis: 0
    active_dims:
    - 0
    - 1
    - 2
sampler:
  name: ddpm
  eta: 1.0
  num_samples: 4
  save_dir: samples
  save_format: npy
lr_scheduler:
  name: cosine_warmup
  base_lr: 0.0001
  min_lr: 1.0e-06
  warmup_steps: 1000
  weight_decay: 1.0e-06
ema:
  use: true
  decay: 0.999
  warmup_steps: 500
